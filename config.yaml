# =============================================================================
# gravi-signal-ml — Configuration
# =============================================================================
# Central configuration for all pipeline stages.
# Override individual values via CLI flags or environment variables.

detectors:
  - "H1"   # LIGO Hanford
  - "L1"   # LIGO Livingston
  - "V1"   # Virgo

# Known reference events for validation and PoC demonstrations
reference_events:
  GW150914:
    start: 1126259446
    end: 1126259478
    detector: "H1"
  GW170817:
    start: 1187008882
    end: 1187008914
    detector: "H1"
  GW231123:
    start: 1385097252
    end: 1385097284
    detector: "H1"

# O4a observing run window (GPS times)
# May 24, 2023 00:00:00 UTC → Jan 16, 2024 16:00:00 UTC
# Defines the hard limits for the O4a run, while run_config provides defaults for scans.
o4a_window:
  gps_start: 1369598418
  gps_start_H1: 1369598418
  gps_start_L1: 1369598418
  gps_end: 1390060818

# Multi-run configuration — observing run start dates and scan defaults
# GPS start is computed at runtime as to_gps(start_date).
run_config:
  O2:  {start_date: "2016-11-30 16:00:00", hours_per_detector: 72}
  O3a: {start_date: "2019-04-01 15:00:00", hours_per_detector: 144}
  O3b: {start_date: "2019-11-01 15:00:00", hours_per_detector: 144}
  O4a: {start_date: "2023-05-24 15:00:00", hours_per_detector: 144}

# Extended scan parameters
scan_extended:
  hours_per_detector: 144
  detectors: ["H1", "L1"]

# Data loading configuration
data_loading:
  local_directories:
    - "E:/o4a"
    - "/mnt/e/o4a"
    - "C:/Users/atafe/Desktop/dante-test/dante-gravi-signal-ml/data/raw/o4a"
    - "/mnt/c/Users/atafe/Desktop/dante-test/dante-gravi-signal-ml/data/raw/o4a"
    - "data/raw"


# Preprocessing parameters
preprocessing:
  sample_rate: 4096
  f_low: 20.0
  f_high: 2000.0
  qrange: [4, 64]
  frange: [20, 2048]
  output_size: [256, 256]
  colormap: cividis            # perceptually uniform; safe under grayscale conversion

# Self-supervised encoder — DINOv2 with Registers
encoder:
  model: "dinov2_vits14_reg"
  embedding_dim: 384
  input_size: 518
  batch_size: 32

# Similarity Check
similarity:
  k_neighbors: 5
  novelty_threshold: 0.85    # cosine sim below this → NOVEL (legacy static; used in full_analysis.py)
  consensus_threshold: 0.60  # label agreement below this → AMBIGUOUS
  training_set_zenodo: "10.5281/zenodo/1476551"
  max_per_class: 50
  duration: 1.0              # spectrogram window used for reference
  # Dynamic (session-adaptive) threshold — replaces static novelty_threshold in MDC/scan_live.
  # Derived from empirical baseline: L1 O4a null segments (n=30), 4s windows, DINOv2 ViT-S/14.
  # novelty_score = baseline_mean - max_sim; NOVEL if novelty_score > k_sigma * baseline_std
  # Measured L1 O4a: mean=0.940, std=0.021 → effective threshold at k=2.5 is ~0.888.
  dynamic_threshold:
    enabled: true
    k_sigma: 2.5             # detection threshold in units of sigma (FAR~0.6% assuming Gaussian noise)
    min_null_samples: 20     # minimum NULL segments required to compute a reliable baseline
    empirical_mean_l1: 0.940 # fallback if live baseline cannot be measured (L1 O4a measurement)
    empirical_std_l1: 0.021  # fallback std (L1 O4a measurement)
    empirical_mean_h1: null  # not yet measured — set after first H1 baseline run
    empirical_std_h1: null   # not yet measured

# In-Domain Reference Index
# Eliminates domain gap by using our own pipeline on labeled GPS timestamps
indomain_reference:
  zenodo_doi: "10.5281/zenodo.5649212"
  detector: "H1"
  run: "O3b"
  min_confidence: 0.95
  max_per_class: 30
  excluded_labels: ["None_of_the_Above"]
  segment_duration: 32.0

# Unsupervised clustering
clustering:
  algorithm: dpmm            # Set DPMM as the default algorithm
  pca_components: 50
  # Global random seed — propagated to PCA, both UMAP passes, and DPMM.
  # Fix this value to guarantee exact reproducibility across sessions.
  random_state: 42
  dpmm:
    n_components: 15
    anomaly_percentile: 5.0
    anomaly_threshold: 4.0191   # calibrated fixed threshold
                              # float  = calibrated fixed threshold
  umap_clustering:
    n_components: 10
    n_neighbors: 30
    min_dist: 0.0
    metric: cosine
  umap_viz:
    n_components: 2
    n_neighbors: 30
    min_dist: 0.1
    metric: cosine
  hdbscan:
    min_cluster_size: 15
    min_samples: 10
    cluster_selection_method: eom
    small_cluster_threshold: auto   # calcolato come 1% di N

# Performance & Parallelization
performance:
  default_workers: 2          # sequential, works on any hardware; può essere aumentato a 6 su CPU multi-core (es. Ryzen 7800X3D)
  recommended_workers: auto   # printed in --help, not auto-applied
  gwosc_fetch_threads: 4      # hard cap, do not exceed (rate limit)
  queue_buffer_multiplier: 2  # queue maxsize = workers * this

# Time-slide background estimation
timeslide:
  iterations: 50   # number of random time-shift trials
  window: 32        # coincidence window in seconds (= segment duration)

# Hardware acceleration
hardware:
  # Compute target selector: "auto" (recommended), "cuda", "mps", "cpu"
  device: "auto"

  # Batch sizes for DINOv2 inference per device type (prevent OOM)
  cuda_batch_size: 64
  mps_batch_size: 32
  cpu_batch_size: 16

  # Note: RTX 5070 (Blackwell sm_120) requires PyTorch nightly (cu128+).
  # If device is "auto", the system falls back to CPU when sm_120 kernels
  # are not available in the installed PyTorch build.

# Patch-Level Novelty Detection
patch_novelty:
  enabled: true
  k_baseline: 68
  k_sweep: [8, 34, 68, 136, 272]
  device: cuda

# Micro-MDC Configuration
micro_mdc:
  glitch_types: [AsymBlip, SpiralBurst]
  n_injections: 20
  n_amplitudes: 8
  amplitude_min: 1.0e-22
  amplitude_max: 1.0e-21
  session: '20260524'
  detector: L1
  seed: 42
  output_dir: results/micro_mdc/
