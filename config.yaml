# =============================================================================
# gravi-signal-ml — Configuration
# =============================================================================
# Central configuration for all pipeline stages.
# Override individual values via CLI flags or environment variables.

detectors:
  - "H1"   # LIGO Hanford
  - "L1"   # LIGO Livingston
  - "V1"   # Virgo

# Known reference events for validation and PoC demonstrations
reference_events:
  GW150914:
    start: 1126259446
    end: 1126259478
    detector: "H1"
  GW170817:
    start: 1187008882
    end: 1187008914
    detector: "H1"
  GW231123:
    start: 1385097252
    end: 1385097284
    detector: "H1"

# O4a observing run window (GPS times)
# May 24, 2023 00:00:00 UTC → Jan 16, 2024 16:00:00 UTC
o4a_window:
  gps_start: 1369598418
  gps_start_H1: 1369598418
  gps_start_L1: 1369598418
  gps_end: 1390060818

# Multi-run configuration — observing run start dates and scan defaults
# GPS start is computed at runtime as to_gps(start_date) + 6*3600
# (offset 6h to avoid the exact beginning of the run)
run_config:
  O2:  {start_date: "2016-11-30T16:00:00", hours_per_detector: 72}
  O3a: {start_date: "2019-04-01T15:00:00", hours_per_detector: 72}
  O3b: {start_date: "2019-11-01T15:00:00", hours_per_detector: 72}
  O4a: {start_date: "2023-05-24T15:00:00", hours_per_detector: 72}

# Extended scan parameters (Phase 3.1)
scan_extended:
  hours_per_detector: 48
  detectors: ["H1", "L1"]
  h1_offset_hours: 6
  l1_offset_hours: 0

# Preprocessing parameters
preprocessing:
  sample_rate: 4096
  f_low: 20.0
  f_high: 2000.0
  qrange: [4, 64]
  frange: [20, 2048]
  output_size: [256, 256]
  colormap: cividis            # perceptually uniform; safe under grayscale conversion

# Self-supervised encoder (Phase 2) — DINOv2 with Registers
encoder:
  model: "dinov2_vits14_reg"
  embedding_dim: 384
  input_size: 518
  batch_size: 32

# Similarity Check (Phase 3.3)
similarity:
  k_neighbors: 5
  novelty_threshold: 0.85    # cosine sim below this → NOVEL
  consensus_threshold: 0.60  # label agreement below this → AMBIGUOUS
  training_set_zenodo: "10.5281/zenodo/1476551"
  max_per_class: 50
  duration: 1.0              # spectrogram window used for reference

# In-Domain Reference Index (Phase 3.4)
# Eliminates domain gap by using our own pipeline on labeled GPS timestamps
indomain_reference:
  zenodo_doi: "10.5281/zenodo.5649212"
  detector: "H1"
  run: "O3b"
  min_confidence: 0.95
  max_per_class: 30
  excluded_labels: ["None_of_the_Above"]
  segment_duration: 32.0

# Unsupervised clustering (Phase 3)
clustering:
  pca_components: 50
  umap_clustering:
    n_components: 10
    n_neighbors: 30
    min_dist: 0.0
    metric: cosine
  umap_viz:
    n_components: 2
    n_neighbors: 30
    min_dist: 0.1
    metric: cosine
  hdbscan:
    min_cluster_size: auto  # calcolato automaticamente come 0.5% di N
    min_samples: 5
    cluster_selection_method: eom
  anomaly_threshold: auto   # calcolato come 1% di N

# Performance & Parallelization (Phase 3.2)
performance:
  default_workers: 1          # sequential, works on any hardware
  recommended_workers: auto   # printed in --help, not auto-applied
  gwosc_fetch_threads: 4      # hard cap, do not exceed (rate limit)
  queue_buffer_multiplier: 2  # queue maxsize = workers * this
