[pytest]
# Without this, a bare `pytest` also collects scratch/ and experiments/, whose
# throwaway scripts import modules that no longer exist — 6 collection errors
# that have nothing to do with the pipeline's health.
testpaths = tests tests_and_validation

markers =
    slow: marks tests as slow (require model download ~90 MB). Use --run-slow to run.
    smoke: fast setup check (<30 s, no model download, no network). Run with -m smoke.
