name: CPU smoke and artifact contracts

on:
  push:
  pull_request:

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - name: Install CPU reference environment
        run: python -m pip install -r requirements-cpu.txt
      - name: Build and install workflow package
        run: |
          python -m pip wheel . --no-deps --wheel-dir "${RUNNER_TEMP}/dante-wheel"
          python -m pip install .
          dante-workflow --help
      - name: Offline smoke checks
        run: python -m pytest -m smoke -q
      - name: Packaging boundary tests
        run: python -m pytest tests/test_dante_workflow_packaging.py -q
      - name: Immutable artifact contract regression tests
        run: >-
          python -m pytest tests/test_v6_critical_fixes.py
          -k "patch_scorer_verifies_two or patch_scorer_rejects_index or dinov2_loader"
          -q
